  // ═══════════════════════════════════════════
  // § RENDERING
  // ═══════════════════════════════════════════

  function renderResponseMeta(response) {
    if (!response || typeof response !== "object") return "";
    const items = [];
    if (response.model) items.push(`<span class="response-meta-model">${escapeHtml(String(response.model))}</span>`);
    if (Number.isFinite(response.cost)) {
      const digits = response.cost < 0.01 ? 6 : 4;
      items.push(`<span>$${response.cost.toFixed(digits).replace(/0+$/, "").replace(/\.$/, "")}</span>`);
    }
    const tokens = response.tokens;
    if (tokens && typeof tokens === "object") {
      const formatTokens = (value) => Number(value).toLocaleString("en-US");
      if (Number.isFinite(tokens.total)) items.push(`<span>${formatTokens(tokens.total)} tokens</span>`);
      const details = [
        ["in", tokens.input], ["out", tokens.output], ["reasoning", tokens.reasoning],
        ["cache read", tokens.cache_read], ["cache write", tokens.cache_write],
      ].filter(([, value]) => Number.isFinite(value));
      if (details.length) {
        const title = details.map(([name, value]) => `${name}: ${formatTokens(value)}`).join(" · ");
        items.push(`<span title="${escapeHtml(title)}">${details.map(([name, value]) => `${name} ${formatTokens(value)}`).join(" · ")}</span>`);
      }
    }
    return items.length ? `<div class="response-meta">${items.join("")}</div>` : "";
  }

  function renderTurn(turn, displayNum) {
    const el = document.createElement("div");
    el.className = "turn";
    el.dataset.index = turn.index;

    let html = "";

    // Turn header bar
    let relStr = "";
    let absStr = "";
    if (turn.timestamp) {
      const d = new Date(turn.timestamp);
      absStr = formatUtcTime(d);
      if (sessionStart != null) {
        const delta = d.getTime() - sessionStart;
        relStr = formatTime(delta);
      }
    }
    const tsHtml = relStr || absStr
      ? `<span class="turn-header-ts" ${absStr ? `title="${absStr}"` : ""}>${relStr || absStr}</span>`
      : "";
    const label = displayNum != null ? displayNum : turn.index;
    html += `<div class="turn-header" onclick="this.parentElement.classList.toggle('collapsed')">
      <span class="turn-header-chevron">&#9660;</span>
      <span class="turn-header-label">#${label}</span>
      ${tsHtml}
    </div>`;

    html += `<div class="turn-body">`;

    // User message
    if (turn.user_text) {
      const userLines = countLines(turn.user_text);
      const userContent = `<div class="user-text">${renderMarkdown(turn.user_text)}</div>`;
      html += `<div class="role-section role-user">
        <div class="role-label role-user-label">User</div>
        ${wrapCollapsible(userContent, userLines, 10)}
      </div>`;
    }

    // System events (background task notifications)
    if (turn.system_events && turn.system_events.length) {
      html += `<div class="role-section role-system">`;
      html += `<div class="role-label role-system-label">System</div>`;
      for (const ev of turn.system_events) {
        html += `<div class="bg-task-badge">${escapeHtml(ev)}</div>`;
      }
      html += `</div>`;
    }

    // Assistant blocks
    if (turn.blocks.length > 0) {
      html += `<div class="role-section role-assistant">`;
      html += `<div class="role-label role-assistant-label">Claude</div>`;

      // Group consecutive tool_use blocks into runs
      const segments = [];
      let toolRun = [];
      let blockIdx = 0;
      for (const block of turn.blocks) {
        if (block.kind === "tool_use" && block.tool_call) {
          toolRun.push(block);
        } else {
          if (toolRun.length > 0) { segments.push({ type: "tools", blocks: toolRun, blockIdx: blockIdx++ }); toolRun = []; }
          segments.push({ type: "single", block, blockIdx: blockIdx++ });
        }
      }
      if (toolRun.length > 0) { segments.push({ type: "tools", blocks: toolRun, blockIdx: blockIdx++ }); }

      for (const seg of segments) {
        const hiddenCls = " block-hidden";
        if (seg.type === "single") {
          const block = seg.block;
          if (block.kind === "text") {
            const lines = countLines(block.text);
            const textContent = `<div class="assistant-text">${renderMarkdown(block.text)}</div>`;
            html += `<div class="block-wrapper${hiddenCls}" data-block-idx="${seg.blockIdx}">${wrapCollapsible(textContent, lines, 15)}</div>`;
          } else if (block.kind === "thinking") {
            html += `<div class="block-wrapper${hiddenCls}" data-block-idx="${seg.blockIdx}"><div class="thinking-block" data-type="thinking">
              <div class="thinking-header" onclick="this.parentElement.classList.toggle('open')">
                <span class="thinking-chevron">&#9654;</span> Thinking <span class="block-spinner"></span>
              </div>
              <div class="thinking-body">${renderMarkdown(block.text)}</div>
            </div></div>`;
          }
        } else {
          // Consecutive tool calls
          const toolHtml = seg.blocks.map(block => {
            const tc = block.tool_call;
            const preview = toolPreview(tc);
            const bodyHtml = formatToolBody(tc);
            return `<div class="tool-block" data-type="tool">
              <div class="tool-header" onclick="this.parentElement.classList.toggle('open')">
                <span class="tool-indicator${tc.is_error ? " tool-error" : ""}"></span>
                <span class="tool-name">${escapeHtml(tc.name)}</span>
                <span class="tool-args-preview">${escapeHtml(preview)}</span>
                <span class="block-spinner"></span>
                <span class="tool-chevron">&#9654;</span>
              </div>
              <div class="tool-body">${bodyHtml}</div>
            </div>`;
          }).join("");

          if (seg.blocks.length <= 4) {
            html += `<div class="block-wrapper${hiddenCls}" data-block-idx="${seg.blockIdx}">${toolHtml}</div>`;
          } else {
            const names = seg.blocks.map(b => b.tool_call.name);
            const uniqueNames = [...new Set(names)].join(", ");
            const hasError = seg.blocks.some(b => b.tool_call.is_error);
            html += `<div class="block-wrapper${hiddenCls}" data-block-idx="${seg.blockIdx}"><div class="tool-group" data-type="tool">
              <div class="tool-group-header" onclick="this.parentElement.classList.toggle('open')">
                <span class="tool-group-chevron">&#9654;</span>
                ${hasError ? '<span class="tool-indicator tool-error" style="display:inline-block;margin-right:4px;"></span>' : ''}${seg.blocks.length} tool calls
                <span class="tool-group-names">${escapeHtml(uniqueNames)}</span>
                <span class="block-spinner"></span>
              </div>
              <div class="tool-group-body">${toolHtml}</div>
            </div></div>`;
          }
        }
      }

      html += renderResponseMeta(turn.response);
      html += `</div>`; // close role-assistant
    }

    html += `</div>`; // close turn-body

    el.innerHTML = html;
    return el;
  }

  function renderAllTurns() {
    for (let i = 0; i < TURNS.length; i++) {
      const turn = TURNS[i];
      const bmLabel = bookmarkMap.get(turn.index);
      if (bmLabel) {
        const divider = document.createElement("div");
        divider.className = "bookmark-divider";
        divider.dataset.turn = turn.index;
        divider.textContent = bmLabel;
        transcript.appendChild(divider);
      }
      const el = renderTurn(turn, i + 1);
      transcript.appendChild(el);
    }
  }

  function applyVisibility() {
    const showThinking = toggleThinking.checked;
    const showTools = toggleTools.checked;

    for (const el of $$('[data-type="thinking"]')) {
      el.style.display = showThinking ? "" : "none";
    }
    for (const el of $$('[data-type="tool"]')) {
      el.style.display = showTools ? "" : "none";
    }
  }

  // ═══════════════════════════════════════════
  // § PLAYER ENGINE
  // ═══════════════════════════════════════════

  function cancelScrollAnim() {
    if (scrollAnim) { cancelAnimationFrame(scrollAnim); scrollAnim = null; }
  }

  function smoothScrollTo(targetY, duration, callback) {
    cancelScrollAnim();
    const startY = window.scrollY;
    const dist = targetY - startY;
    if (Math.abs(dist) < 2) { if (callback) callback(); return; }
    const startTime = performance.now();
    const requirePlaying = !!callback; // only gate on playing when used by auto-play
    function step(now) {
      if (requirePlaying && !playing) { cancelScrollAnim(); return; }
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      // ease-in-out
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      window.scrollTo(0, startY + dist * ease);
      if (t < 1) {
        scrollAnim = requestAnimationFrame(step);
      } else {
        scrollAnim = null;
        if (callback) callback();
      }
    }
    scrollAnim = requestAnimationFrame(step);
  }

  function scrollToTurn(el) {
    scrollProtectUntil = Date.now() + 2000;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const absBottom = el.getBoundingClientRect().bottom + window.scrollY;
        const barH = getControlsHeight();
        const viewH = window.innerHeight - barH;
        const targetY = Math.max(0, absBottom - viewH + PEEK_OFFSET);
        const dist = Math.abs(targetY - window.scrollY);
        if (dist < 2) return;
        const duration = Math.min(TURN_SCROLL_MS + dist * 0.3, 1500);
        smoothScrollTo(targetY, duration);
      });
    });
  }

  function showUpTo(index, { skipScroll = false, hideActiveBlocks = false } = {}) {
    currentTurn = Math.min(index, TURNS.length);
    const turns = turnElements();
    // Mark turns up to currentTurn as visible
    for (let i = 0; i < turns.length; i++) {
      const el = turns[i];
      if (i < currentTurn) {
        el.classList.add("visible");
        if (!playing) {
          // Active turn (last visible): optionally keep blocks hidden
          if (hideActiveBlocks && i === currentTurn - 1) {
            hideAllBlocks(el);
            lightAllWords(el.querySelector(".user-text") || el);
          } else {
            revealAllBlocks(el);
          }
        }
      } else {
        collapseExpanded(el);
        el.classList.remove("visible");
        hideAllBlocks(el);
      }
    }
    updateBookmarkVisibility();
    updateProgress();
    setActiveTurn(currentTurn - 1);

    // Pin active turn just below the controls bar, with a peek of previous turn
    if (!skipScroll && currentTurn > 0) {
      const el = turns[currentTurn - 1];
      if (el) scrollToTurn(el);
    }
  }

  // Adaptive wait: sleeps for gapMs/speed, but reads speed LIVE every tick
  // so changing speed mid-wait takes effect immediately.
  function adaptiveWait(gapMs, onDone) {
    let remaining = gapMs;
    let lastTick = performance.now();
    let timer = null;

    function tick() {
      const now = performance.now();
      remaining -= (now - lastTick) * speed;
      lastTick = now;
      if (remaining <= 0) {
        onDone();
        return;
      }
      timer = setTimeout(tick, Math.min(25, Math.max(4, remaining / speed)));
    }

    tick();
    return function() {
      clearTimeout(timer);
      if (remaining > 0) {
        const now = performance.now();
        remaining -= (now - lastTick) * speed;
        lastTick = now;
      }
      return Math.max(0, remaining);
    };
  }

  /**
   * Compute a word's nominal delay before live player-speed scaling.
   * Combines the WPM base interval with length, deterministic jitter,
   * punctuation, and structural-boundary adjustments documented in README.md.
   */
  function wordDelayMs(word, nextWord, index) {
    const base = 60000 / readingWpm;
    const text = word.textContent || "";
    const letters = text.replace(/[^\p{L}\p{N}]/gu, "").length || text.length || 1;
    const lengthFactor = WORD_LENGTH_BASE_FACTOR + Math.min(letters, WORD_LENGTH_MAX_CHARS) * WORD_LENGTH_PER_CHAR_FACTOR;
    let hash = index + 2166136261;
    for (const char of text) hash = Math.imul(hash ^ char.codePointAt(0), 16777619);
    const jitter = WORD_JITTER_MIN + ((hash >>> 0) % WORD_JITTER_BUCKETS) / WORD_JITTER_DIVISOR;
    let delay = base * lengthFactor * jitter;

    if (/[.!?]["')\]]*$/.test(text)) delay += base * SENTENCE_PAUSE_WORDS;
    else if (/[,;:]["')\]]*$/.test(text)) delay += base * CLAUSE_PAUSE_WORDS;

    if (nextWord) {
      const boundary = "p, li, h3, h4, h5, h6, td, th, pre";
      if (word.closest(boundary) !== nextWord.closest(boundary)) delay += base * PARAGRAPH_PAUSE_WORDS;
    }
    return Math.round(delay);
  }

  const wordTimingCache = new WeakMap();

  function getWordTiming(root) {
    if (!root) return { words: [], prefix: [0], total: 0 };
    const cached = wordTimingCache.get(root);
    if (cached) return cached;
    const words = [...root.querySelectorAll(".paced-segment")];
    const prefix = [0];
    for (let i = 0; i < words.length; i++) {
      prefix.push(prefix[i] + wordDelayMs(words[i], words[i + 1] || null, i));
    }
    const timing = { words, prefix, total: prefix[prefix.length - 1] };
    wordTimingCache.set(root, timing);
    return timing;
  }

  function getLitWordTiming(root) {
    const timing = getWordTiming(root);
    let count = 0;
    while (count < timing.words.length && timing.words[count].classList.contains("word-lit")) count++;
    return {
      duration: timing.prefix[count],
      complete: count === timing.words.length,
    };
  }

  function computePacedWordingTiming() {
    let cursor = 0;
    const starts = [];
    const ends = [];
    const stages = [];
    const turns = turnElements();

    for (let turnIndex = 0; turnIndex < TURNS.length; turnIndex++) {
      const turn = TURNS[turnIndex];
      const turnEl = turns[turnIndex];
      const start = cursor;
      starts.push(start);

      cursor += getWordTiming(turnEl?.querySelector(".user-text")).total;
      const userEnd = cursor;
      const wrappers = [...(turnEl?.querySelectorAll(".block-wrapper") || [])];
      const segments = groupTurnSegments(turn.blocks);
      const gaps = computeSegmentGaps(segments, wrappers.length);
      const blocks = [];

      for (let blockIndex = 0; blockIndex < wrappers.length; blockIndex++) {
        const gap = gaps[blockIndex] || 0;
        cursor += gap;
        cursor += getWordTiming(wrappers[blockIndex].querySelector(".assistant-text")).total;
        blocks.push({ gap, end: cursor });
      }

      ends.push(cursor);
      stages.push({ start, userEnd, blocks, contentEnd: cursor });
      cursor += SHORT_TURN_DELAY_MS;
    }

    return { start: 0, starts, ends, total: cursor, stages };
  }

  function animateWords(root, startAt, onProgress, onComplete) {
    const words = root ? [...root.querySelectorAll(".paced-segment")] : [];
    let index = Math.min(startAt || 0, words.length);
    let waitCancel = null;
    let cancelled = false;

    function next() {
      if (cancelled) return;
      if (index >= words.length) {
        onComplete();
        return;
      }
      const word = words[index];
      const nextWord = words[index + 1] || null;
      word.classList.add("word-lit");
      index++;
      onProgress(index);
      scrollIntoView(word);
      waitCancel = adaptiveWait(wordDelayMs(word, nextWord, index - 1), next);
    }

    next();
    return function() {
      cancelled = true;
      if (waitCancel) waitCancel();
      return index;
    };
  }

  /**
   * Progressively reveal blocks within a turn using timestamps.
   * Reads speed live so changes take effect immediately.
   * Returns a cancel function that instantly reveals remaining blocks.
   */
  function animateTurn(turnIndex, onComplete, startFrom) {
    const turn = TURNS[turnIndex];
    if (!turn) { onComplete(); return function(){}; }

    const el = turnElements()[turnIndex];
    if (!el) { onComplete(); return function(){}; }

    const wrappers = el.querySelectorAll(".block-wrapper");
    if (wrappers.length === 0) { onComplete(); return function(){}; }

    const segments = groupTurnSegments(turn.blocks);
    const gaps = computeSegmentGaps(segments, wrappers.length);

    let cancelled = false;
    let currentWaitCancel = null;
    let currentIdx = startFrom || 0;

    function revealWrapper(idx) {
      const w = wrappers[idx];
      if (!w) return;
      // Clear any previous block-active
      const prev = el.querySelector(".block-active");
      if (prev) prev.classList.remove("block-active");
      w.classList.remove("block-hidden");
      w.classList.add("block-revealing");
      w.classList.add("block-active");
      requestAnimationFrame(() => {
        const barH = getControlsHeight();
        const viewBottom = window.innerHeight - barH;
        const wRect = w.getBoundingClientRect();
        if (wRect.bottom > viewBottom) {
          cancelScrollAnim();
          const targetY = wRect.bottom + window.scrollY - viewBottom + 20;
          window.scrollTo({ top: targetY, behavior: idx === 0 ? "smooth" : "instant" });
        }
      });
    }

    function revealNext() {
      if (cancelled || currentIdx >= gaps.length) {
        if (!cancelled) {
          for (const a of el.querySelectorAll(".block-active")) a.classList.remove("block-active");
          animatePausedState = null;
          onComplete();
        }
        return;
      }
      const idx = currentIdx;
      const gapMs = gaps[idx];
      currentIdx++;

      if (gapMs === 0) {
        revealWrapper(idx);
        revealNext();
        return;
      }

      currentWaitCancel = adaptiveWait(gapMs, () => {
        if (cancelled) return;
        currentWaitCancel = null;
        revealWrapper(idx);
        revealNext();
      });
    }

    function cancel() {
      if (cancelled) return;
      cancelled = true;
      if (currentWaitCancel) { currentWaitCancel(); currentWaitCancel = null; }
      // Freeze in place — save where we paused
      animatePausedState = { turnIndex, blockIdx: currentIdx };
    }

    // Start the chain
    revealNext();
    return cancel;
  }

  function animatePacedWordingTurn(turnIndex, onComplete, startFrom) {
    const turn = TURNS[turnIndex];
    const el = turnElements()[turnIndex];
    if (!turn || !el) { queueMicrotask(onComplete); return function(){}; }

    const wrappers = [...el.querySelectorAll(".block-wrapper")];
    const segments = groupTurnSegments(turn.blocks);
    const gaps = computeSegmentGaps(segments, wrappers.length);

    let state;
    if (startFrom?.mode === "paced-wording") {
      state = { phase: startFrom.phase, blockIdx: startFrom.blockIdx, wordIdx: startFrom.wordIdx };
    } else if (Number.isFinite(startFrom)) {
      state = { phase: "block-wait", blockIdx: startFrom, wordIdx: 0 };
    } else {
      state = { phase: "user-words", blockIdx: 0, wordIdx: 0 };
    }

    let cancelled = false;
    let waitCancel = null;
    let wordCancel = null;

    function waitThen(delay, callback) {
      if (delay <= 0) { callback(); return; }
      waitCancel = adaptiveWait(delay, () => {
        waitCancel = null;
        if (!cancelled) callback();
      });
    }

    function animateRoot(root, onDone) {
      const wordCount = root?.querySelectorAll(".paced-segment").length || 0;
      if (state.wordIdx >= wordCount) { state.wordIdx = 0; onDone(); return; }
      wordCancel = animateWords(root, state.wordIdx, (index) => {
        state.wordIdx = index;
      }, () => {
        wordCancel = null;
        state.wordIdx = 0;
        onDone();
      });
    }

    function revealWrapper(wrapper) {
      const previous = el.querySelector(".block-active");
      if (previous) previous.classList.remove("block-active");
      wrapper.classList.remove("block-hidden");
      wrapper.classList.add("block-revealing", "block-active");
    }

    function finishBlock() {
      state.blockIdx++;
      state.wordIdx = 0;
      state.phase = "block-wait";
      runBlock();
    }

    function runBlockWords() {
      const wrapper = wrappers[state.blockIdx];
      const textRoot = wrapper?.querySelector(".assistant-text");
      if (!textRoot) { finishBlock(); return; }
      animateRoot(textRoot, finishBlock);
    }

    function runBlock() {
      if (cancelled) return;
      if (state.blockIdx >= wrappers.length) {
        for (const active of el.querySelectorAll(".block-active")) active.classList.remove("block-active");
        animatePausedState = null;
        queueMicrotask(() => { if (!cancelled) onComplete(); });
        return;
      }
      if (state.phase === "block-words") { runBlockWords(); return; }

      const wrapper = wrappers[state.blockIdx];
      waitThen(gaps[state.blockIdx] || 0, () => {
        revealWrapper(wrapper);
        const textRoot = wrapper.querySelector(".assistant-text");
        if (textRoot) {
          state.phase = "block-words";
          runBlockWords();
        } else {
          finishBlock();
        }
      });
    }

    function runUserWords() {
      const userRoot = el.querySelector(".user-text");
      if (!userRoot) {
        state.phase = "block-wait";
        runBlock();
        return;
      }
      animateRoot(userRoot, () => {
        state.phase = "block-wait";
        runBlock();
      });
    }

    if (state.phase === "user-words") runUserWords();
    else runBlock();

    return function cancel() {
      if (cancelled) return;
      cancelled = true;
      if (waitCancel) waitCancel();
      if (wordCancel) state.wordIdx = wordCancel();
      animatePausedState = { turnIndex, mode: "paced-wording", ...state };
    };
  }

  function animatePlaybackTurn(turnIndex, onComplete, startFrom) {
    return pacedWording
      ? animatePacedWordingTurn(turnIndex, onComplete, startFrom)
      : animateTurn(turnIndex, onComplete, startFrom);
  }

  // After all blocks in a turn are revealed, pause then advance
  function dwellThenAdvance(remainingMs = SHORT_TURN_DELAY_MS) {
    const cancelWait = adaptiveWait(remainingMs, () => {
      if (!playing) return;
      animateCancelFn = null;
      playStep();
    });
    animateCancelFn = () => {
      const remainingDwellMs = cancelWait();
      animatePausedState = { turnIndex: currentTurn - 1, mode: "dwell", remainingMs: remainingDwellMs };
    };
  }

  function playStep() {
    if (!playing) return;
    if (currentTurn >= TURNS.length) {
      displayedTimeMs = sessionTotalMs;
      updateTimerDisplay();
      stopPlay();
      return;
    }

    // Show the turn container (header + user text) immediately
    const fromSplash = currentTurn === 0;
    showUpTo(currentTurn + 1, { skipScroll: true });

    // From splash: instantly position at the first turn
    if (fromSplash) {
      const el = turnElements()[0];
      if (el) {
        const barH = getControlsHeight();
        const viewH = window.innerHeight - barH;
        const absBottom = el.getBoundingClientRect().bottom + window.scrollY;
        window.scrollTo({ top: Math.max(0, absBottom - viewH + PEEK_OFFSET), behavior: "instant" });
      }
    }

    const el = turnElements()[currentTurn - 1];
    if (!el) { stopPlay(); return; }

    // For turns with no blocks (e.g. /exit), scroll to them directly
    const wrappers = el.querySelectorAll(".block-wrapper");
    if (wrappers.length === 0 && !pacedWording) {
      scrollToBottom(el);
      dwellThenAdvance();
      return;
    }

    // Animate blocks within the turn, then dwell before advancing
    animateCancelFn = animatePlaybackTurn(currentTurn - 1, () => {
      animateCancelFn = null;
      if (!playing) return;
      dwellThenAdvance();
    });
  }

  function startPlay() {
    hideSplash();

    if (currentTurn >= TURNS.length) {
      // Check if the last turn still has unrevealed blocks
      const lastEl = turnElements()[TURNS.length - 1];
      const hasHidden = lastEl && lastEl.querySelectorAll(".block-wrapper.block-hidden").length > 0;
      const hasUnlitWords = pacedWording && lastEl?.querySelector(".paced-segment:not(.word-lit)");
      const hasPausedAnimation = animatePausedState?.turnIndex === TURNS.length - 1;
      if (hasHidden || hasUnlitWords || hasPausedAnimation) {
        // Still have blocks to show — keep at last turn for resume logic below
        currentTurn = TURNS.length;
      } else {
        // Fully played — reset to beginning
        currentTurn = 0;
        animatePausedState = null;
        for (const el of transcript.children) {
          collapseExpanded(el);
          el.classList.remove("visible");
        }
        for (const w of transcript.querySelectorAll(".block-wrapper")) {
          w.classList.add("block-hidden");
          w.classList.remove("block-revealing");
        }
        dimAllWords(transcript);
      }
    }
    playing = true;
    startTimer();
    btnPlay.innerHTML = "&#9646;&#9646;";
    btnPlay.classList.add("active");

    // Scroll current turn into view so it's clear playback started
    if (currentTurn > 0) {
      const el = turnElements()[currentTurn - 1];
      if (el) scrollToBottom(el);
    }

    // Resume mid-turn if we paused inside a block animation
    if (animatePausedState) {
      const ps = animatePausedState;
      animatePausedState = null;
      if (ps.mode === "dwell") {
        dwellThenAdvance(ps.remainingMs);
        return;
      }
      animateCancelFn = animatePlaybackTurn(ps.turnIndex, () => {
        animateCancelFn = null;
        if (!playing) return;
        dwellThenAdvance();
      }, ps.mode === "paced-wording" ? ps : ps.blockIdx);
      return;
    }

    // Resume current turn based on block state
    if (currentTurn > 0) {
      const turnEl = turnElements()[currentTurn - 1];
      if (turnEl) {
        const revealed = turnEl.querySelectorAll(".block-wrapper:not(.block-hidden)").length;
        const total = turnEl.querySelectorAll(".block-wrapper").length;
        if (revealed < total) {
          // Partially revealed (from block-by-block stepping): animate remaining blocks
          animateCancelFn = animatePlaybackTurn(currentTurn - 1, () => {
            animateCancelFn = null;
            if (!playing) return;
            dwellThenAdvance();
          }, revealed);
          return;
        }
        if (revealed > 0 && total > 0) {
          // Fully revealed (from scrolling): dwell then advance to next turn
          dwellThenAdvance();
          return;
        }
      }
    }

    playStep();
  }

  function stopPlay() {
    playing = false;
    stopTimer();
    cancelScrollAnim();
    btnPlay.innerHTML = "&#9654;";
    btnPlay.classList.remove("active");
    if (playTimer) { clearTimeout(playTimer); playTimer = null; }
    if (animateCancelFn) { animateCancelFn(); animateCancelFn = null; }
  }

  /**
   * Unified navigation: all manual navigation (buttons, seek, chapters, clicks)
   * goes through here. Stops playback, clears mid-turn state, manages splash.
   */
  function navigate(targetTurn, opts) {
    if (playing) stopPlay();
    animatePausedState = null;
    if (targetTurn <= 0) {
      showUpTo(0);
      showSplash();
    } else {
      hideSplash();
      showUpTo(Math.min(targetTurn, TURNS.length), opts);
    }
  }

  // Scroll just enough to keep an element visible above the controls bar
  function scrollIntoView(el) {
    requestAnimationFrame(() => {
      const barH = getControlsHeight();
      const viewBottom = window.innerHeight - barH;
      const rect = el.getBoundingClientRect();
      if (rect.bottom > viewBottom) {
        cancelScrollAnim();
        const targetY = rect.bottom + window.scrollY - viewBottom + PEEK_OFFSET;
        window.scrollTo({ top: targetY, behavior: "smooth" });
      } else if (rect.top < 0) {
        cancelScrollAnim();
        const targetY = rect.top + window.scrollY - PEEK_OFFSET;
        window.scrollTo({ top: Math.max(0, targetY), behavior: "smooth" });
      }
    });
  }

  // Scroll so the element's bottom sits just above the controls bar
  function scrollToBottom(el) {
    requestAnimationFrame(() => {
      const barH = getControlsHeight();
      const viewH = window.innerHeight - barH;
      const absBottom = el.getBoundingClientRect().bottom + window.scrollY;
      const targetY = Math.max(0, absBottom - viewH + PEEK_OFFSET);
      cancelScrollAnim();
      window.scrollTo({ top: targetY, behavior: "smooth" });
    });
  }

  function stepForward() {
    if (playing) stopPlay();
    animatePausedState = null;
    scrollProtectUntil = Date.now() + 2000;

    if (currentTurn === 0) {
      // From splash: show turn 1 with blocks hidden
      hideSplash();
      currentTurn = 1;
      const turns = turnElements();
      if (turns[0]) {
        turns[0].classList.add("visible");
        hideAllBlocks(turns[0]);
        reconcilePacedWordsToBlockState(turns[0]);
        scrollToBottom(turns[0]);
      }
      updateBookmarkVisibility();
      updateProgress();
      setActiveTurn(0);
      return;
    }

    const turnEl = turnElements()[currentTurn - 1];
    if (!turnEl) return;
    const hiddenBlocks = turnEl.querySelectorAll(".block-wrapper.block-hidden");

    if (hiddenBlocks.length > 0) {
      // Reveal next block within current turn
      const w = hiddenBlocks[0];
      const prev = turnEl.querySelector(".block-active");
      if (prev) prev.classList.remove("block-active");
      w.classList.remove("block-hidden");
      w.classList.add("block-revealing", "block-active");
      reconcilePacedWordsToBlockState(turnEl);
      syncTimerToBlock();
      scrollIntoView(w);
    } else if (currentTurn < TURNS.length) {
      // All blocks revealed — advance to next turn with blocks hidden
      reconcilePacedWordsToBlockState(turnEl);
      const prev = turnEl.querySelector(".block-active");
      if (prev) prev.classList.remove("block-active");
      currentTurn++;
      const turns = turnElements();
      const nextEl = turns[currentTurn - 1];
      if (nextEl) {
        nextEl.classList.add("visible");
        hideAllBlocks(nextEl);
        reconcilePacedWordsToBlockState(nextEl);
        scrollIntoView(nextEl);
      }
      updateBookmarkVisibility();
      updateProgress();
      setActiveTurn(currentTurn - 1);
    } else {
      reconcilePacedWordsToBlockState(turnEl);
      syncTimerToBlock();
    }
  }

  function stepBack() {
    if (playing) stopPlay();
    animatePausedState = null;
    scrollProtectUntil = Date.now() + 2000;

    const turnEl = currentTurn > 0 ? turnElements()[currentTurn - 1] : null;
    if (turnEl) {
      const revealedBlocks = turnEl.querySelectorAll(".block-wrapper:not(.block-hidden)");
      if (revealedBlocks.length > 0) {
        // Hide last revealed block within current turn
        const last = revealedBlocks[revealedBlocks.length - 1];
        collapseExpanded(last);
        last.classList.add("block-hidden");
        last.classList.remove("block-revealing", "block-active");
        reconcilePacedWordsToBlockState(turnEl);
        // Scroll down to show what remains
        const remaining = turnEl.querySelectorAll(".block-wrapper:not(.block-hidden)");
        if (remaining.length > 0) {
          remaining[remaining.length - 1].classList.add("block-active");
          scrollToBottom(remaining[remaining.length - 1]);
        } else {
          scrollToBottom(turnEl);
        }
        syncTimerToBlock();
        return;
      }
    }

    // No blocks to hide — go to previous turn (all blocks revealed) or splash
    if (currentTurn <= 1) {
      navigate(0);
    } else {
      currentTurn--;
      const turns = turnElements();
      // Hide the turn we just left and close any expanded blocks
      const leftTurn = turns[currentTurn];
      if (leftTurn) {
        collapseExpanded(leftTurn);
        leftTurn.classList.remove("visible");
      }
      // Previous turn should have all blocks revealed
      const prevEl = turns[currentTurn - 1];
      if (prevEl) {
        revealAllBlocks(prevEl);
        scrollToBottom(prevEl);
      }
      updateBookmarkVisibility();
      updateProgress();
      setActiveTurn(currentTurn - 1);
    }
  }

  // ═══════════════════════════════════════════
  // § PROGRESS & NAVIGATION
  // ═══════════════════════════════════════════

  function updateProgress() {
    const pct = Math.max(0, turnToPct(currentTurn) * 100);
    progressFill.style.width = pct + "%";
    // Sync timer to current position
    syncTimerToBlock();
    if (playing) startTimer();
    // Update turn dot states
    for (const dot of progressBar.querySelectorAll(".turn-dot")) {
      const turn = parseInt(dot.dataset.turn, 10);
      dot.classList.toggle("reached", turn <= currentTurn);
    }
    // Update bookmark dot states
    let activeDot = null;
    for (const dot of progressBar.querySelectorAll(".bookmark-dot")) {
      const turn = parseInt(dot.dataset.turn, 10);
      const reached = turn <= currentTurn;
      dot.classList.toggle("reached", reached);
      dot.classList.remove("active");
      if (reached) activeDot = dot;
    }
    if (activeDot) activeDot.classList.add("active");
  }

  function updateTimerDisplay() {
    progressText.textContent = formatTime(displayedTimeMs) + " / " + formatTime(sessionTotalMs);
  }

  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
      // Tick forward scaled by playback speed, capped at session total
      displayedTimeMs = Math.min(displayedTimeMs + 1000 * speed, sessionTotalMs);
      updateTimerDisplay();
      if (displayedTimeMs >= sessionTotalMs) stopTimer();
    }, 1000);
  }

  /** Update timer based on fraction of blocks revealed in current turn. */
  function syncTimerToBlock() {
    if (sessionStart == null || currentTurn <= 0) { displayedTimeMs = 0; updateTimerDisplay(); return; }
    const idx = currentTurn - 1;
    const turnEl = turnElements()[idx];
    if (!turnEl) return;

    if (pacedWordingTiming) {
      const stage = pacedWordingTiming.stages[idx];
      if (!stage) return;
      const userProgress = getLitWordTiming(turnEl.querySelector(".user-text"));
      let elapsed = stage.start + userProgress.duration;
      if (userProgress.complete) {
        const wrappers = [...turnEl.querySelectorAll(".block-wrapper")];
        for (let blockIndex = 0; blockIndex < wrappers.length; blockIndex++) {
          const wrapper = wrappers[blockIndex];
          if (wrapper.classList.contains("block-hidden")) break;
          elapsed += stage.blocks[blockIndex]?.gap || 0;
          const blockProgress = getLitWordTiming(wrapper.querySelector(".assistant-text"));
          elapsed += blockProgress.duration;
          if (!blockProgress.complete) break;
        }
      }
      displayedTimeMs = Math.min(Math.round(elapsed), sessionTotalMs);
      updateTimerDisplay();
      return;
    }

    const total = turnEl.querySelectorAll(".block-wrapper").length;
    const revealed = turnEl.querySelectorAll(".block-wrapper:not(.block-hidden)").length;
    const tStart = turnStartTimes[idx] - sessionStart;
    const tEnd = turnEndTimes[idx] - sessionStart;
    const frac = total > 0 ? revealed / total : 0;
    displayedTimeMs = Math.round(tStart + (tEnd - tStart) * frac);
    updateTimerDisplay();
  }

  function stopTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }

  function setActiveTurn(index) {
    for (const el of $$(".turn.active")) el.classList.remove("active");
    const turns = turnElements();
    if (index >= 0 && index < turns.length) {
      turns[index].classList.add("active");
    }
  }

  function seekFromX(clientX) {
    const rect = progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const target = pctToTurn(pct);
    if (target <= 1 && pct < 0.05) {
      navigate(0);
    } else {
      navigate(Math.max(1, target), { hideActiveBlocks: true });
    }
  }

  // Scroll-based activation: as user scrolls down, reveal new turns
  function onScrollUpdate() {
    if (playing || Date.now() < scrollProtectUntil) return;
    if (isSplashVisible()) return;
    const turns = turnElements();
    if (!turns.length) return;
    const viewMid = window.innerHeight / 2;

    let best = -1;
    for (let i = 0; i < turns.length; i++) {
      const rect = turns[i].getBoundingClientRect();
      if (rect.top < viewMid) best = i;
    }
    if (best >= 0) {
      const idx = best + 1; // 1-based
      if (idx !== currentTurn) {
        if (idx > currentTurn) {
          // Scrolling forward — reveal new turns
          currentTurn = idx;
          for (let i = 0; i < turns.length; i++) {
            turns[i].classList.toggle("visible", i < currentTurn);
            if (i < currentTurn) {
              revealAllBlocks(turns[i]);
            }
          }
          updateBookmarkVisibility();
        } else {
          // Scrolling backward — update active turn (don't hide already-revealed turns)
          currentTurn = idx;
        }
        updateProgress();
        setActiveTurn(currentTurn - 1);
      }
    }
  }

  // ═══════════════════════════════════════════
  // § UI WIRING
  // ═══════════════════════════════════════════

  // Popover management — single close-all + single document click handler
  const popoverWraps = [speedWrap, filterWrap, chapterWrap, moreWrap].filter(Boolean);

  function closeAllPopovers(exceptEl) {
    for (const el of popoverWraps) {
      if (exceptEl && el === exceptEl) continue;
      el.classList.remove("open");
    }
  }


  document.addEventListener("click", (e) => {
    for (const wrap of popoverWraps) {
      if (wrap.classList.contains("open") && wrap.contains(e.target)) return;
    }
    closeAllPopovers();
  });

  // Close all popovers when iframe loses focus
  window.addEventListener("blur", () => { closeAllPopovers(); });

  // Play / Step buttons
  btnPlay.addEventListener("click", () => playing ? stopPlay() : startPlay());
  btnNext.addEventListener("click", stepForward);
  btnPrev.addEventListener("click", stepBack);
  btnNextTurn.addEventListener("click", () => jumpTurn(1));
  btnPrevTurn.addEventListener("click", () => jumpTurn(-1));

  // Speed popover toggle
  speedBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = speedWrap.classList.contains("open");
    closeAllPopovers();
    if (!wasOpen) speedWrap.classList.add("open");
  });

  // Populate speed popover with buttons
  for (let i = SPEED_STEPS.length - 1; i >= 0; i--) { const s = SPEED_STEPS[i];
    const btn = document.createElement("button");
    btn.textContent = s + "x";
    btn.dataset.speed = s;
    if (s === speed) btn.classList.add("active");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      setSpeed(s);
      speedWrap.classList.remove("open");
    });
    speedPopover.appendChild(btn);
  }
  // Add paced toggle to speed popover if real timestamps available
  if (hasRealTimestamps) {
    const pacedLabel = document.createElement("label");
    pacedLabel.className = "paced-toggle";
    pacedLabel.id = "paced-toggle-wrap";
    pacedLabel.title = "Smooth out pauses — timing based on content length instead of real time";
    pacedLabel.innerHTML = '<input type="checkbox" id="toggle-paced"> Auto-paced';
    speedPopover.appendChild(pacedLabel);
    const togglePacedEl = pacedLabel.querySelector("input");
    togglePacedEl.addEventListener("change", () => {
      togglePaced2.checked = togglePacedEl.checked;
      switchTiming(togglePacedEl.checked);
    });
    // Replace the const reference
    togglePaced = togglePacedEl;
  }

  // Filter popover toggle
  filterBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = filterWrap.classList.contains("open");
    closeAllPopovers();
    if (!wasOpen) filterWrap.classList.add("open");
  });

  // Filter checkboxes
  toggleThinking.addEventListener("change", applyVisibility);
  toggleTools.addEventListener("change", applyVisibility);

  // Font size controls
  const FONT_SIZE_STEPS = ["small", "normal", "large"];
  const FONT_SIZE_PX = { small: "11px", normal: "13px", large: "15px" };
  const FONT_SIZE_LABELS = { small: "S", normal: "M", large: "L" };
  let currentFontSize = "normal";
  function setFontSize(size) {
    currentFontSize = size;
    document.body.style.setProperty("--font-size", FONT_SIZE_PX[size] || FONT_SIZE_PX.normal);
    for (const btn of $$(".font-size-cycle")) {
      btn.textContent = FONT_SIZE_LABELS[size] || "M";
    }
  }
  setFontSize(currentFontSize);
  for (const btn of $$(".font-size-cycle")) {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const idx = FONT_SIZE_STEPS.indexOf(currentFontSize);
      setFontSize(FONT_SIZE_STEPS[(idx + 1) % FONT_SIZE_STEPS.length]);
    });
  }

  // Auto-paced toggle (more menu version)
  if (hasRealTimestamps) {
    $("#paced-toggle-wrap2").style.display = "";
  }
  togglePaced2.addEventListener("change", () => {
    if (togglePaced) togglePaced.checked = togglePaced2.checked;
    switchTiming(togglePaced2.checked);
  });

  // Chapter popover toggle (wired in bookmarks section below)

  // More menu (mobile/iframe) toggle
  const moreOpenLink = $("#more-open-link");
  moreBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const wasOpen = moreWrap.classList.contains("open");
    closeAllPopovers();
    if (!wasOpen) {
      // Update open link with current turn position
      const activeTurn = $(".turn.active");
      const turnIdx = activeTurn ? parseInt(activeTurn.dataset.index, 10) : currentTurn;
      moreOpenLink.href = location.href.replace(/#.*/, "") + "#turn=" + turnIdx;
      moreWrap.classList.add("open");
    }
  });

  // Sync more-popover controls with main controls
  speedBtn2.addEventListener("click", () => {
    const idx = SPEED_STEPS.indexOf(speed);
    setSpeed(SPEED_STEPS[(idx + 1) % SPEED_STEPS.length]);
  });

  function syncCheckbox(primary, secondary) {
    secondary.addEventListener("change", () => {
      primary.checked = secondary.checked;
      applyVisibility();
    });
    primary.addEventListener("change", () => {
      secondary.checked = primary.checked;
    });
  }
  syncCheckbox(toggleThinking, toggleThinking2);
  syncCheckbox(toggleTools, toggleTools2);

  // Progress bar interactions
  progressBar.addEventListener("click", (e) => seekFromX(e.clientX));

  // Touch drag on progress bar
  progressBar.addEventListener("touchstart", (e) => {
    e.preventDefault();
    seekFromX(e.touches[0].clientX);
  }, { passive: false });
  progressBar.addEventListener("touchmove", (e) => {
    e.preventDefault();
    seekFromX(e.touches[0].clientX);
  }, { passive: false });

  // Progress bar hover tooltip
  progressBar.addEventListener("mousemove", (e) => {
    const rect = progressBar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const turnIdx = pctToTurn(pct);
    const turn = TURNS[turnIdx - 1];
    let label = `#${turnIdx}`;
    if (turn && turn.timestamp && sessionStart != null) {
      const delta = new Date(turn.timestamp).getTime() - sessionStart;
      label += ` · ${formatTime(delta)}`;
    }
    progressTooltip.textContent = label;
    // Position tooltip, clamped to bar edges
    const left = Math.max(20, Math.min(rect.width - 20, e.clientX - rect.left));
    progressTooltip.style.left = left + "px";
  });

  // Expanding/collapsing sections pauses playback
  transcript.addEventListener("click", (e) => {
    if (playing && (e.target.closest(".turn-header") || e.target.closest(".thinking-header") || e.target.closest(".tool-header") || e.target.closest(".tool-group-header") || e.target.closest(".collapsible-toggle"))) {
      stopPlay();
    }
  });

  // Jump to next/prev turn (all blocks revealed)
  function jumpTurn(dir) {
    if (playing) stopPlay();
    animatePausedState = null;
    scrollProtectUntil = Date.now() + 2000;
    const target = dir > 0
      ? Math.min(currentTurn + 1, TURNS.length)
      : Math.max(currentTurn - 1, 0);
    navigate(target, { hideActiveBlocks: true });
  }

  // Track the last block highlighted by jumpBlock so we can collapse it on next jump
  let lastJumpedBlock = null;

  // Jump to next/prev thinking or tool block, expand it, collapse previous
  function jumpBlock(dir) {
    if (playing) stopPlay();
    animatePausedState = null;
    scrollProtectUntil = Date.now() + 2000;

    // Collect all thinking/tool elements across all turns, respecting filter toggles
    const showThinking = toggleThinking.checked;
    const showTools = toggleTools.checked;
    const allBlocks = [];
    const turns = turnElements();
    for (const turn of turns) {
      for (const wrapper of turn.querySelectorAll(".block-wrapper")) {
        if (showThinking) {
          for (const el of wrapper.querySelectorAll('[data-type="thinking"]')) allBlocks.push(el);
        }
        if (showTools) {
          for (const el of wrapper.querySelectorAll('[data-type="tool"]')) allBlocks.push(el);
        }
      }
    }
    if (allBlocks.length === 0) return;

    // Find current position — either from last jumped block or infer from current turn
    let curIdx = -1;
    if (lastJumpedBlock) {
      curIdx = allBlocks.indexOf(lastJumpedBlock);
    }
    if (curIdx < 0 && currentTurn > 0) {
      // No previous jump — find the last block in/before the current turn
      const curTurnEl = turns[currentTurn - 1];
      if (curTurnEl) {
        for (let i = allBlocks.length - 1; i >= 0; i--) {
          if (curTurnEl.contains(allBlocks[i])) { curIdx = i; break; }
        }
        // If nothing in current turn, find last block before it
        if (curIdx < 0) {
          for (let i = allBlocks.length - 1; i >= 0; i--) {
            const blockTurn = allBlocks[i].closest(".turn");
            const blockTurnIdx = blockTurn ? parseInt(blockTurn.dataset.index, 10) : 0;
            if (blockTurnIdx <= currentTurn) { curIdx = i; break; }
          }
        }
      }
    }

    // Compute next index
    let nextIdx;
    if (dir > 0) {
      nextIdx = curIdx < 0 ? 0 : Math.min(curIdx + 1, allBlocks.length - 1);
    } else {
      nextIdx = curIdx < 0 ? allBlocks.length - 1 : Math.max(curIdx - 1, 0);
    }

    const target = allBlocks[nextIdx];

    // Ensure the target's turn is visible — navigate to it
    const turnEl = target.closest(".turn");
    if (turnEl) {
      const turnIdx = parseInt(turnEl.dataset.index, 10);
      if (turnIdx !== currentTurn) {
        hideSplash();
        showUpTo(turnIdx, { skipScroll: true });
      }
    }

    // Collapse previous, expand target
    if (lastJumpedBlock && lastJumpedBlock !== target) {
      lastJumpedBlock.classList.remove("open");
    }
    target.classList.add("open");
    lastJumpedBlock = target;

    // Set block-active on the wrapper for visual highlight
    const wrapper = target.closest(".block-wrapper");
    if (wrapper) {
      const prevActive = transcript.querySelector(".block-active");
      if (prevActive) prevActive.classList.remove("block-active");
      wrapper.classList.add("block-active");
    }

    scrollIntoView(target);
  }

  // Keyboard shortcuts
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === " " || e.key === "k") { e.preventDefault(); playing ? stopPlay() : startPlay(); }
    if (e.shiftKey && (e.key === "ArrowRight" || e.key === "L")) { e.preventDefault(); jumpTurn(1); return; }
    if (e.shiftKey && (e.key === "ArrowLeft" || e.key === "H")) { e.preventDefault(); jumpTurn(-1); return; }
    if (e.key === "ArrowRight" || e.key === "l") { e.preventDefault(); stepForward(); }
    if (e.key === "ArrowLeft" || e.key === "h") { e.preventDefault(); stepBack(); }
    if (e.key === "t") { e.preventDefault(); jumpBlock(1); }
    if (e.key === "T") { e.preventDefault(); jumpBlock(-1); }
  });

  // Iframe detection — compact mode + title as pop-out link
  let inIframe = false;
  try { inIframe = window !== window.top; } catch (e) { inIframe = true; }
  if (inIframe) {
    document.body.classList.add("in-iframe");
    barTitle.addEventListener("click", () => {
      const activeTurn = $(".turn.active");
      const turnIdx = activeTurn ? parseInt(activeTurn.dataset.index, 10) : currentTurn;
      const url = location.href.replace(/#.*/, "") + "#turn=" + turnIdx;
      window.open(url, "_blank");
    });
  }

  // Scroll handler
  window.addEventListener("scroll", () => {
    if (!scrollTick) {
      scrollTick = true;
      requestAnimationFrame(() => {
        onScrollUpdate();
        scrollTick = false;
      });
    }
  }, { passive: true });

  // --- Turn dots on progress bar ---
  for (let i = 0; i < TURNS.length; i++) {
    const dot = document.createElement("div");
    dot.className = "turn-dot";
    dot.dataset.turn = i + 1;
    dot.style.left = turnToPct(i + 1) * 100 + "%";
    progressBar.appendChild(dot);
  }

  // --- Bookmarks / Chapters ---
  if (BOOKMARKS.length > 0) {
    chapterWrap.style.display = "";

    // Bookmark dots on progress bar (pointer-events: none, clicks go through to bar)
    for (const bm of BOOKMARKS) {
      const dot = document.createElement("div");
      dot.className = "bookmark-dot";
      dot.dataset.turn = bm.turn;
      dot.style.left = turnToPct(bm.turn) * 100 + "%";
      progressBar.appendChild(dot);
    }

    // Chapter menu items (desktop dropdown + more-popover)
    const moreChapters = $("#more-chapters");
    const moreChapterList = $("#more-chapter-list");
    moreChapters.style.display = "";

    for (const bm of BOOKMARKS) {
      const item = document.createElement("div");
      item.className = "chapter-item";
      item.title = bm.label;
      item.innerHTML = `<span class="chapter-item-turn">#${bm.turn}</span><span class="chapter-item-label">${escapeHtml(bm.label)}</span>`;
      item.addEventListener("click", () => {
        navigate(bm.turn, { hideActiveBlocks: true });
        chapterWrap.classList.remove("open");
      });
      chapterMenu.appendChild(item);

      // Duplicate for more-popover
      const item2 = document.createElement("div");
      item2.className = "chapter-item";
      item2.innerHTML = item.innerHTML;
      item2.addEventListener("click", () => {
        navigate(bm.turn, { hideActiveBlocks: true });
        moreWrap.classList.remove("open");
      });
      moreChapterList.appendChild(item2);
    }

    chapterBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasOpen = chapterWrap.classList.contains("open");
      closeAllPopovers();
      if (!wasOpen) chapterWrap.classList.add("open");
    });
  }

  // Init
  transcript.textContent = "";
  transcript.style.opacity = "";
  renderAllTurns();
  if (pacedWording) {
    preparePacedWording();
    pacedWordingTiming = computePacedWordingTiming();
    sessionStart = pacedWordingTiming.start;
    turnStartTimes = pacedWordingTiming.starts;
    turnEndTimes = pacedWordingTiming.ends;
    sessionTotalMs = pacedWordingTiming.total;
    usePaced = true;
  }
  document.body.dataset.playbackMode = pacedWording ? "paced-wording" : "sections";
  document.body.dataset.readingWpm = String(readingWpm);
  applyVisibility();
  const hashMatch = location.hash.match(/turn=(\d+)(r)?/);
  if (hashMatch) {
    const startTurn = Math.min(parseInt(hashMatch[1], 10), TURNS.length);
    const reveal = hashMatch[2] === "r";
    if (startTurn > 0) {
      hideSplash();
      if (reveal) {
        // Watch/live mode: instant scroll, no animation, suppress scroll activation
        showUpTo(startTurn, { hideActiveBlocks: false, skipScroll: true });
        scrollProtectUntil = Date.now() + 2000;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            const el = turnElements()[startTurn - 1];
            if (el) {
              const barH = getControlsHeight();
              const viewH = window.innerHeight - barH;
              const target = el.querySelector(".block-wrapper:last-child") || el;
              const absBottom = target.getBoundingClientRect().bottom + window.scrollY;
              window.scrollTo(0, Math.max(0, absBottom - viewH + PEEK_OFFSET));
            }
          });
        });
      } else {
        // Normal deep link: animated scroll, blocks hidden
        showUpTo(startTurn, { hideActiveBlocks: true });
      }
    }
    // else: turn=0 means splash, which is already visible
  }
  // else: splash is visible, currentTurn = 0, progress at 0%
  updateProgress();

  // React to hash changes (e.g. from parent editor iframe control)
  let lastProcessedHash = location.hash;
  window.addEventListener("hashchange", () => {
    if (location.hash === lastProcessedHash) return;
    lastProcessedHash = location.hash;
    const m = location.hash.match(/turn=(\d+)(r)?/);
    if (!m) return;
    const target = Math.min(parseInt(m[1], 10), TURNS.length);
    const rev = m[2] === "r";
    if (target > 0) {
      stopPlay();
      hideSplash();
      showUpTo(target, { hideActiveBlocks: !rev });
    }
  });

  $("#splash-play").addEventListener("click", () => startPlay());

  // ═══════════════════════════════════════════
  // § FILE ACTIVITY SIDEBAR
  // ═══════════════════════════════════════════

  const fileSidebar = $("#fileSidebar");
  const fileSidebarList = $("#fileSidebarList");
  const fileSidebarToggle = $("#fileSidebarToggle");
  const fileSidebarCount = $("#fileSidebarCount");

  // File activity sidebar — uses pre-computed FILES data

  if (FILES.length > 0) {
    // Calculate sidebar width based on content (min 180, max 260)
    const maxNameLen = Math.max(...FILES.map((f) => f.name.length));
    const sidebarWidth = Math.min(260, Math.max(180, maxNameLen * 8 + 70));
    fileSidebar.style.width = sidebarWidth + "px";
    const style = document.createElement("style");
    style.textContent = "body.sidebar-open .transcript { margin-right: " + sidebarWidth + "px; }";
    document.head.appendChild(style);

    fileSidebarToggle.style.display = "";
    $("#fileSidebarToggle2Wrap").style.display = "";
    fileSidebarCount.textContent = "(" + FILES.length + ")";

    let html = "";
    for (const file of FILES) {
      const tools = new Set(file.refs.map((r) => r.tool));
      const badge = file.refs.length > 1 ? `<span class="file-entry-badge">${file.refs.length}</span>` : "";
      html += `<div class="file-entry" data-path="${escapeHtml(file.path)}">`;
      const displayPath = file.relPath || file.path;
      const dir = displayPath.includes("/") ? displayPath.slice(0, displayPath.lastIndexOf("/")) : "";
      html += `<div class="file-entry-header"><span class="file-entry-chevron">&#9654;</span><span class="file-entry-name" title="${escapeHtml(file.path)}"><span class="file-entry-name-main">${escapeHtml(file.name)}</span>${dir ? `<span class="file-entry-name-path">${escapeHtml(dir)}</span>` : ""}</span>${badge}</div>`;
      html += `<div class="file-entry-refs">`;
      for (const ref of file.refs) {
        html += `<a class="file-entry-ref" data-turn="${ref.turn}" data-block="${ref.block}"><span class="ref-tool">${ref.tool}</span> in turn ${ref.turn}</a>`;
      }
      html += `</div></div>`;
    }
    fileSidebarList.innerHTML = html;

    // Toggle expand/collapse file entries
    fileSidebarList.addEventListener("click", (e) => {
      const header = e.target.closest(".file-entry-header");
      if (header) {
        header.closest(".file-entry").classList.toggle("expanded");
        return;
      }
      const ref = e.target.closest(".file-entry-ref");
      if (ref) {
        const turnIdx = parseInt(ref.dataset.turn);
        if (turnIdx > 0) {
          navigate(turnIdx, { hideActiveBlocks: false });
          scrollProtectUntil = Date.now() + 2000;
          // Expand the matching tool block (and its parent group if grouped)
          const filePath = ref.closest(".file-entry")?.dataset.path;
          const toolName = ref.querySelector(".ref-tool")?.textContent;
          if (filePath) {
            const turnEl = turnElements()[turnIdx - 1];
            if (turnEl) {
              const fileName = filePath.split("/").pop();
              for (const tb of turnEl.querySelectorAll(".tool-block")) {
                const nameEl = tb.querySelector(".tool-name");
                const previewEl = tb.querySelector(".tool-args-preview");
                if (nameEl && previewEl && nameEl.textContent === toolName && previewEl.textContent.includes(fileName)) {
                  // Expand parent tool-group if exists
                  const group = tb.closest(".tool-group");
                  if (group) group.classList.add("open");
                  tb.classList.add("open");
                  break;
                }
              }
            }
          }
          if (window.innerWidth <= 700) fileSidebar.classList.remove("open");
        }
      }
    });
  }

  // Toggle sidebar
  function toggleFileSidebar(open) {
    const show = open !== undefined ? open : !fileSidebar.classList.contains("open");
    if (show) fileSidebar.style.bottom = getControlsHeight() + "px";
    fileSidebar.classList.toggle("open", show);
    document.body.classList.toggle("sidebar-open", show);
  }
  fileSidebarToggle.addEventListener("click", () => toggleFileSidebar());
  $("#fileSidebarToggle2").addEventListener("click", (e) => {
    e.preventDefault();
    closeAllPopovers();
    toggleFileSidebar();
  });
  $("#fileSidebarClose").addEventListener("click", () => toggleFileSidebar(false));

  // Highlight files touched by current turn — poll on interval when sidebar is open
  if (FILES.length > 0) {
    // Build turn → paths lookup from pre-computed FILES data
    const turnToFiles = new Map();
    for (const file of FILES) {
      for (const ref of file.refs) {
        if (!turnToFiles.has(ref.turn)) turnToFiles.set(ref.turn, new Set());
        turnToFiles.get(ref.turn).add(file.path);
      }
    }
    let lastHighlightedTurn = -1;
    setInterval(() => {
      if (!fileSidebar.classList.contains("open")) return;
      if (currentTurn === lastHighlightedTurn) return;
      lastHighlightedTurn = currentTurn;
      const touchedPaths = turnToFiles.get(currentTurn) || new Set();
      for (const entry of fileSidebarList.querySelectorAll(".file-entry-header")) {
        const path = entry.closest(".file-entry").dataset.path;
        entry.classList.toggle("active", touchedPaths.has(path));
      }
    }, 300);
  }

  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
