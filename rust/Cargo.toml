[package]
name = "chemuniverse-core"
version = "0.1.0"
edition = "2021"
description = "Rust core for chemuniverse: skeleton tree, canonical labeling, bond-order payload, SMILES"

[lib]
name = "chemuniverse_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
